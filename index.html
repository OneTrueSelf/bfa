<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Friend Anita</title>
  <style>
    :root {
      --bg1: #f3efe8;
      --bg2: #e6ecf5;
      --bg3: #f5e6e0;
      --card: #fffaf3;
      --text: #3f372f;
      --muted: #6f6256;
      --accent: #c97b63;
      --border: #e2d3c2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }

    header {
      text-align: center;
      padding: 50px 20px;
      font-size: 2.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #d6e4f0, #f5d6cc);
      border-bottom: 2px solid var(--border);
    }

    .subtitle {
      display: block;
      margin-top: 10px;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .container {
      max-width: 1000px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }

    .section {
      margin-bottom: 25px;
      padding: 26px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      text-align: justify
    }

    .section::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: var(--accent);
      border-top-left-radius: 16px;
      border-bottom-left-radius: 16px;
    }

    .section h2 {
      margin: 0 0 12px 0;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .section p {
      margin: 0;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .section .meta {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 22px 10px 30px;
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  Best Friend Anita
  <span class="subtitle">Great personalities are always remembered.</span>
</header>

<div class="container">

</body>
</html>
